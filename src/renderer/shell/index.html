<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'" />
    <title>Nabsun</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="themes.css" />
  </head>
  <body>
    <div id="app">
      <header id="topchrome">
        <div id="tabstrip">
          <div id="tabs" role="tablist" aria-label="Open tabs"></div>
          <button id="new-tab" class="icon-btn" title="New tab (Ctrl+T)" aria-label="New tab">+</button>
          <div class="drag-spacer"></div>
          <div id="window-controls" role="group" aria-label="Window controls">
            <button id="win-min" class="win-btn" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10"/></svg></button>
            <button id="win-max" class="win-btn" title="Maximize" aria-label="Maximize"><svg class="maximize-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9"/></svg><svg class="restore-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 5.5v-2h7v7h-2"/><rect x="3.5" y="5.5" width="7" height="7"/></svg></button>
            <button id="win-close" class="win-btn close-window" title="Close" aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 3.5 9 9m0-9-9 9"/></svg></button>
          </div>
        </div>

        <div id="toolbar">
          <button id="nav-back" class="icon-btn" title="Back" aria-label="Back">‹</button>
          <button id="nav-forward" class="icon-btn" title="Forward" aria-label="Forward">›</button>
          <button id="nav-reload" class="icon-btn" title="Reload (Ctrl+R)" aria-label="Reload">⟳</button>

          <button id="omnibox" title="Search or enter address (Ctrl+L)">
            <span id="omnibox-scheme" class="scheme"></span>
            <span id="omnibox-text">Search or enter address</span>
          </button>

          <button id="bookmark" class="icon-btn" title="Bookmark this page" aria-label="Bookmark">☆</button>
          <button id="downloads-btn" class="icon-btn" title="Downloads (Ctrl+J)" aria-label="Downloads">⭳<span id="dl-badge" class="badge-dot" hidden></span></button>
          <div id="ext-actions" role="toolbar" aria-label="Extension buttons"></div>
          <button id="update-btn" class="pill" hidden>Update available</button>
          <button id="developer-tools-btn" class="icon-btn" title="Page developer tools (F12)" aria-label="Page developer tools"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m6 5-4 5 4 5m8-10 4 5-4 5m-3-12-2 14"/></svg></button>
          <button id="browser-settings-btn" class="icon-btn" title="Settings" aria-label="Settings">&#9881;</button>
          <button id="extensions-btn" class="icon-btn" title="Extensions" aria-label="Extensions">🧩</button>
          <button id="ask-page" class="pill" title="Ask the assistant about this page">Ask about page</button>
          <button id="sidebar-toggle" class="icon-btn" title="Toggle assistant (Ctrl+Shift+A)" aria-label="Toggle assistant">◨</button>
        </div>
      </header>

      <div id="bookmarks-bar" role="toolbar" aria-label="Bookmarks bar"></div>

      <div id="password-bar" hidden>
        <span class="pw-icon">🔑</span>
        <span id="pw-message"></span>
        <div class="grow"></div>
        <button id="pw-save" class="primary">Save</button>
        <button id="pw-never" class="ghost">Not now</button>
      </div>

      <div id="findbar" hidden>
        <input id="find-input" type="text" placeholder="Find in page" aria-label="Find in page" />
        <span id="find-count" class="muted"></span>
        <button id="find-prev" class="icon-btn" aria-label="Previous match">↑</button>
        <button id="find-next" class="icon-btn" aria-label="Next match">↓</button>
        <button id="find-close" class="icon-btn" aria-label="Close find bar">✕</button>
      </div>

      <main id="body">
        <!-- The Chromium page view is layered over this region by the main process. -->
        <div id="content-placeholder"></div>
        <section id="workspace" aria-label="Browser settings and setup" hidden>
          <div class="workspace-top"><span class="workspace-brand">Nabsun <span>/ Your space</span></span><button id="workspace-close">Back to browser</button></div>
            <section id="view-settings" class="view">
              <div id="settings-body"></div>
            </section>
            <section id="view-onboarding" class="view"><div id="onboarding-body" class="welcome"></div></section>
        </section>

        <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize assistant panel"></div>

        <aside id="sidebar" aria-label="AI assistant">
          <div id="sidebar-head">
            <div class="assistant-titlebar">
              <strong id="sidebar-title">Assistant</strong>
              <div class="grow"></div>
              <button id="new-chat" class="icon-btn" title="New chat" aria-label="New chat"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
              <details id="assistant-menu" class="assistant-menu">
                <summary class="icon-btn" title="Assistant options" aria-label="Assistant options"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1"/><circle cx="10" cy="10" r="1"/><circle cx="16" cy="10" r="1"/></svg></summary>
                <div class="assistant-options" aria-label="Assistant options">
                  <p class="assistant-menu-label">Assistant</p>
                  <button id="history-btn">Chat history</button>
                  <button id="assistant-detach" title="Detach assistant into a separate window">Detach assistant</button>
                  <div id="assistant-zoom" role="group" aria-label="Assistant text size"><span>Text size</span><button id="assistant-zoom-out" title="Smaller text (Ctrl+-)" aria-label="Smaller text">A&#8722;</button><button id="assistant-zoom-reset" title="Reset text size (Ctrl+0)" aria-label="Reset text size">100%</button><button id="assistant-zoom-in" title="Larger text (Ctrl++)" aria-label="Larger text">A+</button></div>
                  <div class="assistant-menu-divider"></div>
                  <p class="assistant-menu-label">Browser</p>
                  <button id="assistant-extensions">Extensions</button>
                  <button id="bookmarks-btn">Bookmarks</button>
                  <button id="passwords-btn">Saved passwords</button>
                  <button id="settings-btn">Settings</button>
                </div>
              </details>
              <button id="assistant-hide" class="icon-btn" title="Hide assistant" aria-label="Hide assistant"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
            </div>
            <div id="busy-bar" hidden aria-hidden="true"><span></span></div>
          </div>

          <div id="sidebar-views">

            <section id="view-chat" class="view active">
              <div id="transcript" aria-live="polite"></div>
              <div id="composer">
                <div id="prompt-queue" aria-label="Queued prompts" aria-live="polite" hidden></div>
                <div id="composer-chips">
                  <label class="chip">
                    <input type="checkbox" id="attach-page" checked />
                    <span>Include page</span>
                  </label>
                  <label class="chip" title="Let the assistant click and type without asking each time">
                    <input type="checkbox" id="autopilot" />
                    <span>Autopilot</span>
                  </label>
                  <div class="grow"></div>
                  <span id="step-badge" class="muted"></span>
                </div>
                <div class="composer-row">
                  <textarea id="prompt" rows="1" placeholder="Ask about this page, or tell me what to do…" aria-label="Message the assistant"></textarea>
                  <button id="send" class="primary" aria-label="Send">Send</button>
                  <button id="stop" class="danger" hidden aria-label="Stop">Stop</button>
                </div>
              </div>
            </section>

            <section id="view-history" class="view">
              <div class="view-head">
                <button class="link back-to-chat">← Back</button>
                <strong>Chats</strong>
              </div>
              <div id="session-list"></div>
            </section>

            <section id="view-downloads" class="view">
              <div class="view-head">
                <button class="link back-to-chat">← Back</button>
                <strong>Downloads</strong>
                <div class="grow"></div>
                <button id="dl-folder" class="link">Open folder</button>
                <button id="dl-clear" class="link">Clear</button>
              </div>
              <div id="download-list"></div>
            </section>

            <section id="view-bookmarks" class="view">
              <div class="view-head">
                <button class="link back-to-chat">← Back</button>
                <strong>Bookmarks</strong>
                <div class="grow"></div>
                <button id="bm-bar-toggle" class="link">Show bar</button>
              </div>
              <div id="bookmarks-body"></div>
            </section>

            <section id="view-passwords" class="view">
              <div class="view-head">
                <button class="link back-to-chat">← Back</button>
                <strong>Saved passwords</strong>
              </div>
              <div id="passwords-body"></div>
            </section>

            <section id="view-extensions" class="view">
              <div class="view-head">
                <button class="link back-to-chat">← Back</button>
                <strong>Extensions</strong>
              </div>
              <div id="extensions-body"></div>
            </section>


          </div>
        </aside>
      </main>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
