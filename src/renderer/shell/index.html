<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'" />
    <title>Nabsun</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="themes.css" />
  </head>
  <body>
    <div id="app">
      <header id="topchrome">
        <div id="tabstrip">
          <div id="tabs" role="tablist" aria-label="Open tabs"></div>
          <button id="new-tab" class="icon-btn" title="New tab (Ctrl+T)" aria-label="New tab"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
          <div class="drag-spacer"></div>
          <div id="window-controls" role="group" aria-label="Window controls">
            <button id="win-min" class="win-btn" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10"/></svg></button>
            <button id="win-max" class="win-btn" title="Maximize" aria-label="Maximize"><svg class="maximize-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9"/></svg><svg class="restore-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 5.5v-2h7v7h-2"/><rect x="3.5" y="5.5" width="7" height="7"/></svg></button>
            <button id="win-close" class="win-btn close-window" title="Close" aria-label="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 3.5 9 9m0-9-9 9"/></svg></button>
          </div>
        </div>

        <div id="toolbar">
          <button id="nav-back" class="icon-btn" title="Back" aria-label="Back"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m11 4-6 6 6 6M5 10h12"/></svg></button>
          <button id="nav-forward" class="icon-btn" title="Forward" aria-label="Forward"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m9 4 6 6-6 6M3 10h12"/></svg></button>
          <button id="nav-reload" class="icon-btn" title="Reload (Ctrl+R)" aria-label="Reload"><svg viewBox="0 0 20 20" aria-hidden="true"><g class="reload-icon"><path d="M16 7a6.5 6.5 0 1 0 .4 5M16 3v4h-4"/></g><path class="stop-icon" d="m5 5 10 10M15 5 5 15"/></svg></button>

          <button id="omnibox" title="Search or enter address (Ctrl+L)">
            <span id="omnibox-scheme" class="scheme"></span>
            <span id="omnibox-text">Search or enter address</span>
          </button>

          <button id="bookmark" class="icon-btn" title="Bookmark this page" aria-label="Bookmark"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2 2.5 5.1 5.6.8-4.1 4 .9 5.6-4.9-2.6-4.9 2.6.9-5.6-4.1-4 5.6-.8Z"/></svg></button>
          <button id="downloads-btn" class="icon-btn" title="Downloads (Ctrl+J)" aria-label="Downloads"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v10m-4-4 4 4 4-4M3 13v4h14v-4"/></svg><span id="dl-badge" class="badge-dot" hidden></span></button>
          <div id="ext-actions" role="toolbar" aria-label="Extension buttons"></div>
          <button id="update-btn" class="pill" hidden><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 2v10m-4-4 4 4 4-4M3 13v4h14v-4"/></svg><span>Update available</span><span id="update-version" aria-hidden="true"></span></button>
          <button id="browser-settings-btn" class="icon-btn" title="Settings" aria-label="Settings"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 2-.5 2-2 1-2-.5-2 3 1.5 1.5v2L1.5 13l2 3 2-.5 2 1 .5 2h4l.5-2 2-1 2 .5 2-3-1.5-1.5v-2L18.5 8l-2-3-2 .5-2-1L12 2Z"/><circle cx="10" cy="10.5" r="3"/></svg></button>
          <button id="extensions-btn" class="icon-btn" title="Extensions" aria-label="Extensions"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v5a2.5 2.5 0 1 1 0 5v4h5a2.5 2.5 0 1 1 5 0h4v-5a2.5 2.5 0 1 0 0-5V3h-5a2.5 2.5 0 1 0-5 0Z"/></svg></button>
          <button id="sidebar-toggle" class="icon-btn" title="Toggle assistant (Ctrl+Shift+A)" aria-label="Toggle assistant" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3" width="15" height="14" rx="2"/><path d="M11.5 3v14M14.5 7v6"/></svg></button>
        </div>
      </header>

      <div id="bookmarks-bar" role="toolbar" aria-label="Bookmarks bar"></div>

      <div id="password-bar" hidden>
        <span class="pw-icon">🔑</span>
        <span id="pw-message"></span>
        <div class="grow"></div>
        <button id="pw-save" class="primary">Save</button>
        <button id="pw-never" class="ghost">Not now</button>
      </div>

      <div id="findbar" hidden>
        <input id="find-input" type="text" placeholder="Find in page" aria-label="Find in page" />
        <span id="find-count" class="muted"></span>
        <button id="find-prev" class="icon-btn" aria-label="Previous match">↑</button>
        <button id="find-next" class="icon-btn" aria-label="Next match">↓</button>
        <button id="find-close" class="icon-btn" aria-label="Close find bar">✕</button>
      </div>

      <main id="body">
        <!-- The Chromium page view is layered over this region by the main process. -->
        <div id="content-placeholder"></div>
        <section id="workspace" aria-label="Browser settings and setup" hidden>
          <div class="workspace-top"><span class="workspace-brand">Nabsun <span>/ Your space</span></span><button id="workspace-close">Back to browser</button></div>
            <section id="view-settings" class="view">
              <div id="settings-body"></div>
            </section>
            <section id="view-workflows" class="view"><div id="workflows-body" class="data-page"></div></section>
            <section id="view-activity" class="view"><div id="activity-body" class="data-page"></div></section>
            <section id="view-onboarding" class="view"><div id="onboarding-body" class="welcome"></div></section>
        </section>

        <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize assistant panel"></div>

        <aside id="sidebar" aria-label="AI assistant">
          <div id="sidebar-head">
            <div class="assistant-titlebar">
              <strong id="sidebar-title">Assistant</strong>
              <div class="grow"></div>
              <button id="new-chat" class="icon-btn" title="New chat" aria-label="New chat"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12"/></svg></button>
              <details id="assistant-menu" class="assistant-menu">
                <summary class="icon-btn" title="Assistant options" aria-label="Assistant options"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="1"/><circle cx="10" cy="10" r="1"/><circle cx="16" cy="10" r="1"/></svg></summary>
                <div class="assistant-options" aria-label="Assistant options">
                  <p class="assistant-menu-label">Assistant</p>
                  <button id="history-btn">Chat history</button>
                  <button id="workflows-btn">Data &amp; workflows</button>
                  <button id="assistant-detach" title="Detach assistant into a separate window">Detach assistant</button>
                  <div id="assistant-zoom" role="group" aria-label="Assistant text size"><span>Text size</span><button id="assistant-zoom-out" title="Smaller text (Ctrl+-)" aria-label="Smaller text">A&#8722;</button><button id="assistant-zoom-reset" title="Reset text size (Ctrl+0)" aria-label="Reset text size">100%</button><button id="assistant-zoom-in" title="Larger text (Ctrl++)" aria-label="Larger text">A+</button></div>
                  <div class="assistant-menu-divider"></div>
                  <p class="assistant-menu-label">Browser</p>
                  <button id="assistant-extensions">Extensions</button>
                  <button id="bookmarks-btn">Bookmarks</button>
                  <button id="passwords-btn">Saved passwords</button>
                  <button id="settings-btn">Settings</button>
                </div>
              </details>
              <button id="assistant-hide" class="icon-btn" title="Hide assistant" aria-label="Hide assistant"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
            </div>
            <div id="busy-bar" hidden aria-hidden="true"><span></span></div>
          </div>

          <div id="sidebar-views">

            <section id="view-chat" class="view active">
              <div id="transcript" aria-live="polite"></div>
              <div id="composer">
                <div id="local-folder-access" aria-label="Connected local folders" hidden></div>
                <p id="local-folder-status" class="hint" role="status" aria-live="polite"></p>
                <div id="session-tool-grants" aria-label="Session tool permissions" hidden></div>
                <div id="batch-progress" aria-label="Batch progress" aria-live="polite" hidden></div>
                <div id="attached-files" aria-label="Attached files" aria-live="polite" hidden></div>
                <p id="attachment-status" class="hint" role="status"></p>
                <div id="voice-controls" hidden>
                  <button id="voice-close" type="button" class="icon-btn" title="Close dictation (Escape)" aria-label="Close dictation"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button>
                  <label>Speech language <select id="voice-language" aria-label="Speech language"></select></label>
                  <p id="voice-status" class="hint" role="status" aria-live="polite"></p>
                </div>
                <div id="prompt-queue" aria-label="Queued prompts" aria-live="polite" hidden></div>
                <div class="composer-box">
                  <textarea id="prompt" rows="2" placeholder="Tell me what you need help with..." aria-label="Message the assistant" title="Enter to send. Shift+Enter for a new line."></textarea>
                  <div class="composer-row">
                    <button id="attach-files" class="composer-tool" aria-label="Attach images or files" title="Attach images, documents or data. Up to 20 files, 20 MB each; visual analysis up to 5 MB per image."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 12 7-7a4 4 0 0 1 6 6L10 22a6 6 0 0 1-8-8L13 3M6 16 17 5"/></svg></button>
                    <button id="choose-local-folder" class="composer-tool folder-access-button" aria-label="Choose a folder on your computer" title="Choose a folder and decide whether Nabsun can read files or make changes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h7l2 3h9v11H3Z M16 12v5M13.5 14.5h5"/></svg><span>Folder</span></button>
                    <button id="voice-toggle" hidden disabled class="icon-btn" title="Dictate a message" aria-label="Dictate a message" aria-pressed="false" aria-controls="voice-controls" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2" width="6" height="10" rx="3"/><path d="M4 9a6 6 0 0 0 12 0M10 15v3M7 18h6"/></svg></button>
                    <div class="grow"></div>
                    <span class="composer-shortcut">Enter to send</span>
                    <button id="send" class="primary" aria-label="Send"><span class="send-label">Send</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 15V5M5 10l5-5 5 5"/></svg></button>
                    <button id="stop" class="danger" hidden aria-label="Stop">Stop</button>
                  </div>
                </div>
                <div id="composer-chips">
                  <label class="chip" title="Include text from the open page with your question. Turn off to ask without sharing the page.">
                    <input type="checkbox" id="attach-page" checked />
                    <span>Use this page</span>
                  </label>
                  <button id="approval-mode-button" type="button" class="chip" title="Change approval mode in Settings">Ask for approval</button>
                  <div class="grow"></div>
                  <span id="step-badge" class="muted"></span>
                </div>

              </div>
            </section>

            <section id="view-history" class="view">
              <div class="view-head">
                <button class="link back-to-chat">← Back</button>
                <strong>Chats</strong>
              </div>
              <div id="session-list"></div>
            </section>

            <section id="view-downloads" class="view">
              <div class="view-head">
                <button class="link back-to-chat">← Back</button>
                <strong>Downloads</strong>
                <div class="grow"></div>
                <button id="dl-folder" class="link">Open folder</button>
                <button id="dl-clear" class="link">Clear</button>
              </div>
              <div id="download-list"></div>
            </section>

            <section id="view-bookmarks" class="view">
              <div class="view-head">
                <button class="link back-to-chat">← Back</button>
                <strong>Bookmarks</strong>
                <div class="grow"></div>
                <button id="bm-bar-toggle" class="link">Show bar</button>
              </div>
              <div id="bookmarks-body"></div>
            </section>

            <section id="view-passwords" class="view">
              <div class="view-head">
                <button class="link back-to-chat">← Back</button>
                <strong>Saved passwords</strong>
              </div>
              <div id="passwords-body"></div>
            </section>

            <section id="view-extensions" class="view">
              <div class="view-head">
                <button class="link back-to-chat">← Back</button>
                <strong>Extensions</strong>
              </div>
              <div id="extensions-body"></div>
            </section>


          </div>
        </aside>
      </main>
    </div>

    <script type="module" src="main.js"></script>
  </body>
</html>
