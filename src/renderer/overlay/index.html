<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Nabsun overlay</title>
    <style>
      :root {
        --bg: #dfe4d3;
        --bg-raised: #faf9f5;
        --bg-input: #faf9f5;
        --border: #d6d5ce;
        --border-strong: #bcbbaf;
        --text: #20211e;
        --text-dim: #55564d;
        --text-faint: #74766c;
        --accent: #ff5b2c;
        --accent-soft: #c2410c;
        --accent-tint: #ff5b2c1f;
        --hero: #e7ebdc;
        --hover: #20211e0a;
        --scrim: #20211e59;
        --shadow: #20211e1f;
        --accent-deep: #a8380c;
        --danger: #b3392a;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --bg: #1e1f1b;
        --bg-raised: #24251f;
        --bg-input: #2b2c26;
        --border: #33342e;
        --border-strong: #4a4b42;
        --text: #dedcd2;
        --text-dim: #a8a99e;
        --text-faint: #83847a;
        --accent: #ff6f42;
        --accent-soft: #ff9169;
        --accent-tint: #ff6f4224;
        --hero: #26281f;
        --danger: #f0705f;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']):not([data-theme='dark']) {
          --bg: #1e1f1b;
          --bg-raised: #24251f;
          --bg-input: #2b2c26;
          --border: #33342e;
          --border-strong: #4a4b42;
          --text: #dedcd2;
          --text-dim: #a8a99e;
          --text-faint: #83847a;
          --accent: #ff6f42;
          --accent-soft: #ff9169;
          --accent-tint: #ff6f4224;
          --hero: #26281f;
          --danger: #f0705f;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: transparent; color: var(--text);
        font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
        user-select: none;
      }
      #backdrop {
        position: fixed; inset: 0;
        background: var(--scrim);
        display: flex; justify-content: center;
        padding-top: 64px;
      }
      #backdrop.palette { align-items: flex-start; padding-top: 128px; }
      #panel {
        width: min(720px, calc(100vw - 96px));
        max-height: calc(100vh - 140px);
        display: flex; flex-direction: column;
        background: var(--bg-raised);
        border: 1px solid var(--border-strong);
        border-radius: 12px;
        box-shadow: 0 24px 64px var(--shadow);
        overflow: hidden;
      }
      #input {
        width: 100%; padding: 15px 18px;
        border: none; border-bottom: 1px solid var(--border);
        background: transparent; color: var(--text);
        font: inherit; font-size: 15px; user-select: text;
      }
      #input:focus { outline: none; }
      #input::placeholder { color: var(--text-faint); }
      #list { overflow-y: auto; padding: 6px; }
      .item {
        display: flex; align-items: center; gap: 11px;
        padding: 9px 12px; border-radius: 8px; cursor: default;
      }
      .item.selected { background: var(--accent-tint); }
      .item .kind {
        flex: 0 0 auto; width: 18px; text-align: center;
        color: var(--text-faint); font-size: 13px;
      }
      .item .text { flex: 1; min-width: 0; }
      .item .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .item .sub {
        color: var(--text-faint); font-size: 11.5px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .item .hintkey {
        flex: 0 0 auto; color: var(--text-faint); font-size: 11px;
        border: 1px solid var(--border-strong); border-radius: 4px; padding: 1px 6px;
      }
      .empty { padding: 18px; color: var(--text-faint); text-align: center; }
      ::-webkit-scrollbar { width: 9px; }
      ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 5px; }
    </style>
  </head>
  <body>
    <div id="backdrop">
      <div id="panel">
        <input id="input" type="text" spellcheck="false" autocomplete="off" aria-label="Command input" />
        <div id="list" role="listbox"></div>
      </div>
    </div>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
