<!doctype html>
<html lang="en" data-theme="{{THEME}}">
  <head>
    <meta charset="utf-8" />
    <title>Page not available</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg-raised: #f4f5f8;
        --bg-input: #ffffff;
        --border: #e2e4ea;
        --border-strong: #c6cad3;
        --text: #1c1f26;
        --text-dim: #596072;
        --text-faint: #878e9e;
        --accent: #5b3fd6;
        --accent-soft: #6d4fe0;
        --accent-tint: #5b3fd626;
        --hero: #ece9fb;
        --hover: #0000000a;
        --scrim: #1c1f2659;
        --shadow: #1c1f2626;
        --accent-deep: #4a32b0;
        --danger: #d12b4e;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --bg: #14141a;
        --bg-raised: #1c1c24;
        --bg-input: #23232d;
        --border: #2e2e3a;
        --border-strong: #3d3d4d;
        --text: #e8e8f0;
        --text-dim: #9a9aae;
        --text-faint: #6b6b80;
        --accent: #7c5cff;
        --accent-soft: #9b82ff;
        --accent-tint: #7c5cff26;
        --hero: #221c44;
        --danger: #ff5c7c;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']):not([data-theme='dark']) {
          --bg: #14141a;
          --bg-raised: #1c1c24;
          --bg-input: #23232d;
          --border: #2e2e3a;
          --border-strong: #3d3d4d;
          --text: #e8e8f0;
          --text-dim: #9a9aae;
          --text-faint: #6b6b80;
          --accent: #7c5cff;
          --accent-soft: #9b82ff;
          --accent-tint: #7c5cff26;
          --hero: #221c44;
          --danger: #ff5c7c;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; padding: 40px 24px;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: var(--bg); color: var(--text);
        font: 14px/1.65 "Segoe UI", system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .icon {
        width: 62px; height: 62px; border-radius: 16px;
        background: var(--bg-input); border: 1px solid var(--border-strong);
        display: grid; place-items: center; font-size: 28px;
      }
      h1 { margin: 0; font-size: 20px; font-weight: 600; }
      p { margin: 0; color: var(--text-dim); max-width: 520px; }
      .url {
        font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px;
        color: var(--accent-soft); word-break: break-all; max-width: 520px;
      }
      .code { color: var(--text-faint); font-size: 12px; }
      .actions { display: flex; gap: 10px; margin-top: 6px; }
      button {
        padding: 9px 18px; border-radius: 7px; border: 1px solid var(--border-strong);
        background: transparent; color: var(--text); font: inherit; font-size: 13px;
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:hover { border-color: var(--accent); }
      ul { color: var(--text-dim); text-align: left; max-width: 460px; margin: 4px 0 0; line-height: 1.9; }
    </style>
  </head>
  <body>
    <div class="icon">⚠</div>
    <h1 id="title">This page could not be loaded</h1>
    <p class="url" id="url"></p>
    <p id="detail"></p>
    <ul id="hints"></ul>
    <div class="actions">
      <button class="primary" id="retry">Try again</button>
      <button id="back">Go back</button>
    </div>
    <p class="code" id="code"></p>

    <!-- Substituted when this page is injected into a failed navigation; left
         as-is when it is opened directly, in which case we read the query. -->
    <script id="error-data" type="application/json">{{ERROR_JSON}}</script>
    <script>
      function readParams() {
        try {
          const raw = document.getElementById('error-data').textContent.trim();
          if (raw && !raw.startsWith('{{')) return JSON.parse(raw);
        } catch (e) {
          /* fall through to the query string */
        }
        const q = new URLSearchParams(location.search);
        return { url: q.get('url'), code: q.get('code'), desc: q.get('desc') };
      }

      const params = readParams();
      const url = params.url || '';
      const code = params.code || '';
      const desc = params.desc || 'The page could not be reached.';

      document.getElementById('url').textContent = url;
      document.getElementById('code').textContent = code ? `Error ${code}` : '';

      // Map the common Chromium network errors onto plain language.
      const FRIENDLY = {
        ERR_NAME_NOT_RESOLVED: ["This site can't be found", "We couldn't find the server for that address.", ['Check the address for typos', 'Check your internet connection', 'Try searching for it instead']],
        ERR_INTERNET_DISCONNECTED: ['No internet connection', 'This device appears to be offline.', ['Check your Wi-Fi or cable', 'Try again once you are back online']],
        ERR_CONNECTION_REFUSED: ["This site refused to connect", 'The server is reachable but declined the connection.', ['The site may be down', 'If it is a local server, check that it is running']],
        ERR_CONNECTION_TIMED_OUT: ['This site took too long to respond', 'The server did not answer in time.', ['Try again in a moment', 'Check whether a proxy or VPN is interfering']],
        ERR_CONNECTION_RESET: ['The connection was reset', 'The connection was closed unexpectedly.', ['Reload the page', 'Check any VPN or firewall']],
        ERR_CERT_AUTHORITY_INVALID: ['This connection is not private', "The site's security certificate is not trusted.", ['Do not enter passwords or card details', 'This can happen on corporate networks that inspect traffic']],
        ERR_CERT_COMMON_NAME_INVALID: ['This connection is not private', "The certificate does not match this site's address.", ['Do not enter sensitive information here']],
        ERR_CERT_DATE_INVALID: ['This connection is not private', "The site's certificate has expired.", ['Check that your system clock is correct']],
        ERR_TOO_MANY_REDIRECTS: ['This page is redirecting in a loop', 'The site kept redirecting and never settled.', ['Clearing cookies for this site usually fixes it']],
        ERR_EMPTY_RESPONSE: ['This site sent no data', 'The server closed the connection without responding.', ['Try reloading the page']],
        ERR_ABORTED: ['Loading was stopped', 'The navigation was cancelled.', ['Try loading the page again']],
      };

      const known = FRIENDLY[code];
      if (known) {
        document.getElementById('title').textContent = known[0];
        document.getElementById('detail').textContent = known[1];
        const list = document.getElementById('hints');
        for (const hint of known[2]) {
          const li = document.createElement('li');
          li.textContent = hint;
          list.appendChild(li);
        }
      } else {
        document.getElementById('detail').textContent = desc;
      }

      document.getElementById('retry').addEventListener('click', () => {
        if (url) location.replace(url);
      });
      document.getElementById('back').addEventListener('click', () => history.back());
      document.getElementById('retry').focus();
    </script>
  </body>
</html>
