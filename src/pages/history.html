<!doctype html>
<html lang="en" data-theme="{{THEME}}">
  <head>
    <meta charset="utf-8" />
    <title>History</title>
    <style>
      :root {
        --bg: #ffffff;
        --bg-raised: #f4f5f8;
        --bg-input: #ffffff;
        --border: #e2e4ea;
        --border-strong: #c6cad3;
        --text: #1c1f26;
        --text-dim: #596072;
        --text-faint: #878e9e;
        --accent: #5b3fd6;
        --accent-soft: #6d4fe0;
        --accent-tint: #5b3fd626;
        --hero: #ece9fb;
        --hover: #0000000a;
        --scrim: #1c1f2659;
        --shadow: #1c1f2626;
        --accent-deep: #4a32b0;
        --danger: #d12b4e;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --bg: #14141a;
        --bg-raised: #1c1c24;
        --bg-input: #23232d;
        --border: #2e2e3a;
        --border-strong: #3d3d4d;
        --text: #e8e8f0;
        --text-dim: #9a9aae;
        --text-faint: #6b6b80;
        --accent: #7c5cff;
        --accent-soft: #9b82ff;
        --accent-tint: #7c5cff26;
        --hero: #221c44;
        --danger: #ff5c7c;
        color-scheme: dark;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']):not([data-theme='dark']) {
          --bg: #14141a;
          --bg-raised: #1c1c24;
          --bg-input: #23232d;
          --border: #2e2e3a;
          --border-strong: #3d3d4d;
          --text: #e8e8f0;
          --text-dim: #9a9aae;
          --text-faint: #6b6b80;
          --accent: #7c5cff;
          --accent-soft: #9b82ff;
          --accent-tint: #7c5cff26;
          --hero: #221c44;
          --danger: #ff5c7c;
          color-scheme: dark;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; padding: 34px 24px 60px;
        background: var(--bg); color: var(--text);
        font: 14px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      .wrap { max-width: 820px; margin: 0 auto; }
      h1 { font-size: 22px; font-weight: 620; margin: 0 0 18px; }
      input {
        width: 100%; padding: 11px 16px; margin-bottom: 20px;
        border: 1px solid var(--border-strong); border-radius: 999px;
        background: var(--bg-raised); color: inherit; font: inherit;
      }
      input:focus { outline: none; border-color: var(--accent); }
      .day { color: var(--text-faint); font-size: 11.5px; text-transform: uppercase;
             letter-spacing: .07em; margin: 22px 0 8px; }
      a.row {
        display: flex; align-items: baseline; gap: 12px;
        padding: 9px 12px; border-radius: 8px;
        color: inherit; text-decoration: none;
      }
      a.row:hover { background: var(--hover); }
      .time { color: var(--text-faint); font-size: 12px; flex: 0 0 62px; }
      .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .host { color: var(--text-faint); font-size: 12px; flex: 0 0 auto; max-width: 240px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .empty { color: var(--text-faint); padding: 40px 0; text-align: center; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>History</h1>
      <input id="q" type="text" placeholder="Search history…" autocomplete="off" autofocus />
      <div id="list"></div>
    </div>

    <!-- The protocol handler substitutes the payload, so this page needs no
         IPC bridge of its own. -->
    <script id="data" type="application/json">{{HISTORY_JSON}}</script>
    <script>
      const ENTRIES = JSON.parse(document.getElementById('data').textContent || '[]');

      const list = document.getElementById('list');
      const q = document.getElementById('q');

      function dayLabel(ts) {
        const d = new Date(ts);
        const today = new Date();
        const yesterday = new Date(Date.now() - 86400000);
        const same = (a, b) => a.toDateString() === b.toDateString();
        if (same(d, today)) return 'Today';
        if (same(d, yesterday)) return 'Yesterday';
        return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
      }

      function render(filter) {
        list.textContent = '';
        const f = filter.trim().toLowerCase();
        const rows = ENTRIES.filter(
          (e) => !f || e.title.toLowerCase().includes(f) || e.url.toLowerCase().includes(f),
        );

        if (!rows.length) {
          const empty = document.createElement('div');
          empty.className = 'empty';
          empty.textContent = f ? 'No matching pages.' : 'No history yet.';
          list.appendChild(empty);
          return;
        }

        let currentDay = null;
        for (const entry of rows) {
          const label = dayLabel(entry.visitedAt);
          if (label !== currentDay) {
            currentDay = label;
            const h = document.createElement('div');
            h.className = 'day';
            h.textContent = label;
            list.appendChild(h);
          }
          const a = document.createElement('a');
          a.className = 'row';
          a.href = entry.url;

          const time = document.createElement('span');
          time.className = 'time';
          time.textContent = new Date(entry.visitedAt).toLocaleTimeString([], {
            hour: '2-digit', minute: '2-digit',
          });

          const title = document.createElement('span');
          title.className = 'title';
          title.textContent = entry.title || entry.url;

          const host = document.createElement('span');
          host.className = 'host';
          try { host.textContent = new URL(entry.url).hostname.replace(/^www\./, ''); } catch {}

          a.append(time, title, host);
          list.appendChild(a);
        }
      }

      q.addEventListener('input', () => render(q.value));
      render('');
    </script>
  </body>
</html>
