appId: com.nabsun.app
productName: Nabsun
copyright: Copyright © 2026 Nabsun contributors

directories:
  output: release
  buildResources: build

# Application code is bundled by esbuild, so node_modules is not shipped —
# everything the app imports is already inside dist/.
files:
  - dist/**/*
  - '!dist/test/**/*'
  - package.json
  # Licences travel with the build, not only with the repository. Neither of
  # these was in the packaged app, which left the redistributed weights without
  # the notice their licence requires.
  - LICENSE
  - THIRD-PARTY-NOTICES.md
  - PRIVACY.md
  - CODE_SIGNING.md
  - '!node_modules/**/*'

# The native engine and model notices ship with the app. The 1.28 GB weights
# are deliberately omitted: first-run setup downloads the pinned, verified
# model only when the user chooses local AI. Keeping the exclusion here makes
# every platform artifact small without changing source/dev model validation.
extraResources:
  - from: vendor
    to: vendor
    filter:
      - '**/*'
      - '!models/*.gguf'

# Destinations use null to disable publishing; "never" is only a CLI policy.
publish: null

beforePack: ./scripts/check-build-target.cjs

asar: true
# A child process cannot be spawned from inside an asar archive, and the MCP
# server is spawned by the agent CLIs, so it ships unpacked.
asarUnpack:
  - dist/main/office-worker.js
  - dist/main/plugin-worker.js
  - dist/bin/**
  - dist/main/file-parser.js
  - dist/pdf/**

# Electron ships its own copies of these; dropping them saves ~40 MB.
removePackageScripts: true
removePackageKeywords: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  artifactName: Nabsun-${version}-${arch}-setup.${ext}

nsis:
  license: build/installer-notice.txt
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Nabsun
  deleteAppDataOnUninstall: false

portable:
  artifactName: Nabsun-${version}-portable.${ext}

# Build the host architecture; vendor/llama must match it.
mac:
  # Ad-hoc signing is required for a runnable local Apple silicon build.
  # Override with a Developer ID identity for notarized distribution.
  identity: "-"
  target:
    - target: dmg
    - target: zip
  icon: build/icon.png
  category: public.app-category.productivity
  artifactName: Nabsun-${version}-${arch}.${ext}
  # V8 needs a writable-executable mapping, and the app spawns helper
  # processes for MCP servers and the agent CLIs.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Nabsun lets websites use your camera only after you allow access.
    NSMicrophoneUsageDescription: Nabsun lets websites use your microphone only after you allow access.
  gatekeeperAssess: false

dmg:
  title: Nabsun ${version}
  contents:
    - x: 140
      y: 190
      type: file
    - x: 400
      y: 190
      type: link
      path: /Applications

linux:
  target: [AppImage]
  icon: build/icon.png
  category: Network
