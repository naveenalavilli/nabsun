name: verify

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  CI: 'true'

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Ensure Electron is installed
        run: npm run setup

      # Diagnose ordinary build/test failures before downloading the model.
      - name: Type check
        run: ./scripts/ci-run.ps1 typecheck
      - name: Verify CI configuration and artifacts
        run: node --test scripts/verify-ci-publishing.cjs scripts/verify-ci-artifacts.cjs
      - name: Verify engine payload validation
        run: npm run verify:payload
      - name: Build
        run: ./scripts/ci-run.ps1 build
      - name: Verify CLI launching
        timeout-minutes: 5
        run: ./scripts/ci-run.ps1 verify:cli
      - name: Verify browser
        timeout-minutes: 10
        run: ./scripts/ci-run.ps1 verify:browse
      - name: Verify page bridge
        timeout-minutes: 10
        run: ./scripts/ci-run.ps1 verify:page
      - name: Verify agent
        timeout-minutes: 10
        run: ./scripts/ci-run.ps1 verify:agent
      - name: Verify MCP bridge
        timeout-minutes: 5
        run: ./scripts/ci-run.ps1 verify:mcp

      # Cache only weights, verified against the fetch script's pinned digest.
      # Re-download the small, digest-pinned engine archive each job instead of
      # trusting the extracted engine's self-authored cache manifest.
      - name: Restore model weights
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/models/*.gguf
          key: model-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('scripts/fetch-local-model.mjs') }}
          restore-keys: |
            model-${{ runner.os }}-${{ runner.arch }}-v1-
      - name: Fetch and verify embedded payload
        timeout-minutes: 20
        run: ./scripts/ci-run.ps1 fetch:model
      - name: Check release payload
        run: ./scripts/ci-run.ps1 check:payload

      # A later test failure should not force another gigabyte download.
      - name: Cache verified model weights
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/models/*.gguf
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
      - name: Verify bundled model inference
        timeout-minutes: 20
        env:
          NABSUN_REQUIRE_LOCAL: '1'
        run: ./scripts/ci-run.ps1 verify:local

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs-${{ github.run_attempt }}
          path: ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  verify-macos:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npm run setup
      - run: npm run typecheck
      - run: npm run verify:payload
      - run: npm run build
      - name: Verify Unix CLI launching with Node and Electron
        run: |
          npm run verify:cli
          node scripts/electron-run.mjs dist/test/cli-harness.js
      - uses: actions/cache@v4
        with:
          path: vendor/models/*.gguf
          key: model-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('scripts/fetch-local-model.mjs', 'scripts/engine-payload.mjs') }}
          restore-keys: |
            model-${{ runner.os }}-${{ runner.arch }}-v1-
      - name: Fetch and verify native payload
        timeout-minutes: 20
        run: |
          npm run fetch:model
          npm run check:payload
      - name: Verify browser, agents and local inference
        timeout-minutes: 15
        env:
          NABSUN_REQUIRE_LOCAL: '1'
        run: |
          npm run verify:browse
          npm run verify:page
          npm run verify:agent
          npm run verify:mcp
          npm run verify:local
      - name: Verify signed Mac application payload
        run: |
          npm run icon
          npx electron-builder --mac dir --publish never
          app_path=$(find release -maxdepth 2 -name Nabsun.app -print -quit)
          test -n "$app_path"
          codesign --verify --deep --strict "$app_path"
          node scripts/check-release-payload.mjs --resources "$app_path/Contents/Resources"

  package:
    runs-on: windows-2022
    needs: [verify, verify-macos]
    timeout-minutes: 60
    # Only this job may write, and only the release step below uses it. The
    # workflow default stays `contents: read`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Ensure Electron is installed
        run: npm run setup
      - name: Restore model weights
        uses: actions/cache/restore@v4
        with:
          path: vendor/models/*.gguf
          key: model-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('scripts/fetch-local-model.mjs') }}
          restore-keys: |
            model-${{ runner.os }}-${{ runner.arch }}-v1-
      - name: Fetch and verify embedded payload
        timeout-minutes: 20
        run: ./scripts/ci-run.ps1 fetch:model
      # Verification builds must never attempt to create a GitHub release.
      - name: Build installers
        timeout-minutes: 35
        run: ./scripts/ci-run.ps1 dist:win:ci
      - name: Verify the packaged payload
        run: node scripts/check-release-payload.mjs --resources release/win-unpacked/resources
      - name: Check installers and generate checksums
        id: installers
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installers = @(
            "release/Nabsun-$version-x64-setup.exe",
            "release/Nabsun-$version-portable.exe"
          )
          $checksums = foreach ($installer in $installers) {
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
              throw "Expected installer missing: $installer"
            }
            if ((Get-Item -LiteralPath $installer).Length -eq 0) {
              throw "Installer is empty: $installer"
            }
            $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $installer)"
          }
          $checksums | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: package-logs-${{ github.run_attempt }}
          path: |
            ci-logs/*.log
            release/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 7
      # A successful package job must leave downloadable installers on GitHub,
      # including PRs and ordinary branch pushes. Do not make upload optional.
      - name: Upload installers
        id: upload-installers
        uses: actions/upload-artifact@v4
        with:
          name: nabsun-windows-${{ steps.installers.outputs.version }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            release/Nabsun-${{ steps.installers.outputs.version }}-x64-setup.exe
            release/Nabsun-${{ steps.installers.outputs.version }}-portable.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Show package download
        if: always()
        env:
          INSTALLER_URL: ${{ steps.upload-installers.outputs.artifact-url }}
          UPLOAD_OUTCOME: ${{ steps.upload-installers.outcome }}
          PACKAGE_VERSION: ${{ steps.installers.outputs.version }}
        run: |
          if ($env:UPLOAD_OUTCOME -eq 'success' -and $env:INSTALLER_URL) {
            @"
          ## Windows packages - $env:PACKAGE_VERSION

          [Download setup and portable installers]($env:INSTALLER_URL)

          Includes SHA256SUMS.txt. Download available for 7 days; sign in to GitHub with repository access.
          "@ >> $env:GITHUB_STEP_SUMMARY
          } else {
            '## Windows packages' >> $env:GITHUB_STEP_SUMMARY
            'No downloadable package was uploaded. Check the failed or cancelled steps above.' >> $env:GITHUB_STEP_SUMMARY
          }

      # ------------------------------------------------------------ release --
      # Workflow artifacts expire in 7 days and need a signed-in GitHub account,
      # so they cannot be what anyone downloads. A release is how people get the
      # installers, and it happens in exactly one situation: a version that has
      # never been released lands on main. That means merging a version bump is
      # the act that ships — there is no separate tag to remember, and nothing
      # cut from a branch, because this only ever runs on a push to main.
      #
      # The installers are ~1.3 GB each and are uploaded from the runner that
      # built them, so the bytes never travel from a developer's machine.
      - name: Is this a version that has not shipped?
        id: gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PACKAGE_VERSION: ${{ steps.installers.outputs.version }}
        run: |
          $tag = "v$env:PACKAGE_VERSION"
          # An existing tag means this version already shipped; every later merge
          # that does not bump the version must not republish it.
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
            "$tag already exists - nothing to release. Bump the version to ship." | Write-Host
            "release=false" >> $env:GITHUB_OUTPUT
          } else {
            "$tag is new - releasing." | Write-Host
            "release=true" >> $env:GITHUB_OUTPUT
            "tag=$tag" >> $env:GITHUB_OUTPUT
          }

      - name: Publish the release
        if: steps.gate.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          # The tag is derived from package.json and created here, at the merge
          # commit, so a tag can never disagree with the version it ships.
          tag_name: ${{ steps.gate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Nabsun ${{ steps.gate.outputs.tag }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Windows installers for ${{ steps.gate.outputs.tag }}, built and verified by this workflow.

            | File | What it is |
            |---|---|
            | `Nabsun-${{ steps.installers.outputs.version }}-x64-setup.exe` | Installer. Adds a Start-menu entry and an uninstaller. |
            | `Nabsun-${{ steps.installers.outputs.version }}-portable.exe` | Single executable. Runs without installing. |
            | `SHA256SUMS.txt` | Checksums. Verify with `Get-FileHash <file> -Algorithm SHA256`. |

            Both include the built-in model, so they work offline with no account and no API key. That is why they are around 1.3 GB.

            **These builds are not code-signed.** Windows SmartScreen will warn with
            "Windows protected your PC" — choose **More info -> Run anyway**, after
            checking the download against `SHA256SUMS.txt` above.
          files: |
            release/Nabsun-${{ steps.installers.outputs.version }}-x64-setup.exe
            release/Nabsun-${{ steps.installers.outputs.version }}-portable.exe
            release/SHA256SUMS.txt
