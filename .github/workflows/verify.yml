name: verify

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      upload_installers:
        description: 'Upload Windows installers (approximately 2.6 GB)'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

env:
  CI: 'true'

jobs:
  verify:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Ensure Electron is installed
        run: npm run setup

      # Diagnose ordinary build/test failures before downloading the model.
      - name: Type check
        run: ./scripts/ci-run.ps1 typecheck
      - name: Verify CI publishing configuration
        run: node --test scripts/verify-ci-publishing.cjs
      - name: Build
        run: ./scripts/ci-run.ps1 build
      - name: Verify CLI launching
        timeout-minutes: 5
        run: ./scripts/ci-run.ps1 verify:cli
      - name: Verify browser
        timeout-minutes: 10
        run: ./scripts/ci-run.ps1 verify:browse
      - name: Verify page bridge
        timeout-minutes: 10
        run: ./scripts/ci-run.ps1 verify:page
      - name: Verify agent
        timeout-minutes: 10
        run: ./scripts/ci-run.ps1 verify:agent
      - name: Verify MCP bridge
        timeout-minutes: 5
        run: ./scripts/ci-run.ps1 verify:mcp

      # Cache only weights, verified against the fetch script's pinned digest.
      # Re-download the small, digest-pinned engine archive each job instead of
      # trusting the extracted engine's self-authored cache manifest.
      - name: Restore model weights
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor/models/*.gguf
          key: model-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('scripts/fetch-local-model.mjs') }}
          restore-keys: |
            model-${{ runner.os }}-${{ runner.arch }}-v1-
      - name: Fetch and verify embedded payload
        timeout-minutes: 20
        run: ./scripts/ci-run.ps1 fetch:model
      - name: Check release payload
        run: ./scripts/ci-run.ps1 check:payload

      # A later test failure should not force another gigabyte download.
      - name: Cache verified model weights
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor/models/*.gguf
          key: ${{ steps.model-cache.outputs.cache-primary-key }}
      - name: Verify bundled model inference
        timeout-minutes: 20
        env:
          NABSUN_REQUIRE_LOCAL: '1'
        run: ./scripts/ci-run.ps1 verify:local

      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs-${{ github.run_attempt }}
          path: ci-logs/*.log
          if-no-files-found: ignore
          retention-days: 7

  package:
    runs-on: windows-2022
    needs: verify
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Ensure Electron is installed
        run: npm run setup
      - name: Restore model weights
        uses: actions/cache/restore@v4
        with:
          path: vendor/models/*.gguf
          key: model-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('scripts/fetch-local-model.mjs') }}
          restore-keys: |
            model-${{ runner.os }}-${{ runner.arch }}-v1-
      - name: Fetch and verify embedded payload
        timeout-minutes: 20
        run: ./scripts/ci-run.ps1 fetch:model
      # Verification builds must never attempt to create a GitHub release.
      - name: Build installers
        timeout-minutes: 35
        run: ./scripts/ci-run.ps1 dist:win:ci
      - name: Verify the packaged payload
        run: node scripts/check-release-payload.mjs --resources release/win-unpacked/resources
      - name: Upload failure diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: package-logs-${{ github.run_attempt }}
          path: |
            ci-logs/*.log
            release/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 7
      # Manual verification only uploads installers when explicitly requested.
      - name: Upload installers
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.upload_installers)
        uses: actions/upload-artifact@v4
        with:
          name: nabsun-windows
          path: release/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
